name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Check dependencies
        run: go mod verify
      - name: Race tests
        run: go test -race ./... -count=1 -timeout=90s
      - name: Vet and formatting
        run: make check
      - name: Build static binary
        run: make build
      - name: Native kernel setup in disposable namespaces
        run: |
          sudo modprobe wireguard
          go test -c -race -o bin/daemon.test ./internal/daemon
          sudo env VPNGATE_NATIVE_TEST=1 ./bin/daemon.test -test.run '^TestNativeNetworkIsolation$' -test.v -test.timeout=90s
      - name: Validate examples
        run: |
          ./bin/vpngate check --config examples/fetch.json
          ./bin/vpngate check --config examples/attach.json
